[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supertrader"
version = "0.1.0"
description = "Auditable SOL signal research and paper trading platform"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=18,<25", "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.27,<1", "websockets>=14,<17", "pydantic>=2.9,<3", "PyYAML>=6,<7", "scikit-learn>=1.5,<2", "scipy>=1.13,<2", "joblib>=1.4,<2", "ccxt>=4.4,<5", "feedparser>=6,<7", "sqlalchemy>=2,<3"]

[project.optional-dependencies]
research = ["lightgbm>=4.5,<5", "torch>=2.5,<3", "hmmlearn>=0.3,<1", "arch>=7,<9", "shap>=0.46,<1", "mlflow-skinny>=2.18,<4", "alembic>=1.14,<2"]
rl = ["gymnasium>=1,<2", "stable-baselines3>=2.5,<3", "sb3-contrib>=2.5,<3"]
news = ["transformers>=4.46,<6"]
phase2 = ["duckdb>=1.2,<2", "PyWavelets>=1.7,<2", "optuna>=4,<5"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "mypy>=1.13,<2", "types-PyYAML>=6,<7"]

[project.scripts]
supertrader = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["torch.*", "stable_baselines3.*", "sb3_contrib.*", "mlflow.*"]
follow_imports = "skip"

