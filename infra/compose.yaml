services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supertrader
      POSTGRES_USER: supertrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U supertrader"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis:/data
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SUPERTRADER_DB_URL: postgresql+psycopg://supertrader:${POSTGRES_PASSWORD}@db/supertrader
      SUPERTRADER_ADMIN_TOKEN: ${SUPERTRADER_ADMIN_TOKEN:-}
    volumes:
      - ../data:/app/data
      - ../artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres:
  redis:
